name: scrape
on:
  schedule:
    - cron: "0 5 * * *"   # 08:00 Vilniuje vasarą
    - cron: "0 6 * * *"   # 08:00 Vilniuje žiemą (should_run.py praleidžia nereikalingą)
  workflow_dispatch:
permissions:
  contents: write
concurrency: scrape
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - id: chk
        run: python3 scraper/should_run.py
        env:
          EVENT: ${{ github.event_name }}
      - if: steps.chk.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: steps.chk.outputs.run == 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-lit
          pip install -r scraper/requirements.txt && playwright install --with-deps chromium
      - if: steps.chk.outputs.run == 'true'
        run: python scraper/scrape.py
        env:
          DEBUG: "1"
      - if: always() && steps.chk.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: debug
          path: scraper/debug
          if-no-files-found: ignore
      - if: steps.chk.outputs.run == 'true'
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add prices.json
          git diff --staged --quiet || (git commit -m "update prices" && git push)
      - if: always() && steps.chk.outputs.run == 'true'
        run: |
          rm -f scraper/debug/*.html scraper/debug/*.b64
          git checkout --orphan debug-out && git rm -rf -q --cached . && git clean -fdxq -e scraper/debug
          cp -r scraper/debug/. . 2>/dev/null || true
          git add -A -- . ':!scraper' 2>/dev/null; git commit -qm "debug" && git push -f origin debug-out || true
