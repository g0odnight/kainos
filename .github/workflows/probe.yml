name: probe
on: workflow_dispatch
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r scraper/requirements.txt && playwright install --with-deps chromium
      - run: python scraper/probe.py
      - if: always()
        run: |
          git config user.name "price-bot"; git config user.email "price-bot@users.noreply.github.com"
          git checkout --orphan probe-out && git rm -rf -q --cached . && cp -r scraper/probe/. . && git add -- *.txt *.json && git commit -qm probe && git push -f origin probe-out || true
