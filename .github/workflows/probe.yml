name: probe
on:
  push:
    branches: [probe-silas]
    paths: [probe/silas.py, .github/workflows/probe.yml]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: |
          sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-lit imagemagick
          pip install -r scraper/requirements.txt && playwright install --with-deps chromium
      - run: python probe/silas.py
      - run: |
          git config user.name "price-bot"; git config user.email "price-bot@users.noreply.github.com"
          git checkout --orphan probe-out && git rm -rf -q --cached . && git add probe/out && git commit -qm probe && git push -f origin probe-out
