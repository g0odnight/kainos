name: scrape-local
# IKI, Norfa ir Promo blokuoja debesų serverius, todėl šis darbas vykdomas TAVO kompiuteryje
# (GitHub "self-hosted runner"). Įsijungia tik kai repo kintamasis LOCAL_RUNNER = 1.
on:
  schedule:
    - cron: "40 6 * * *"   # ~08:40 / 09:40 Vilniuje, po debesų darbo
  workflow_dispatch:
permissions:
  contents: write
concurrency: scrape
jobs:
  run:
    if: vars.LOCAL_RUNNER == '1'
    runs-on: [self-hosted, Windows]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Scrape IKI, Norfa, Promo
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python -m pip install -q -r scraper/requirements.txt
          python -m playwright install chromium
          python scraper/scrape.py --store IKI,Norfa,Promo --local
      - name: Commit
        shell: pwsh
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add prices.json
          git diff --staged --quiet
          if ($LASTEXITCODE -ne 0) { git commit -m "update prices (local)"; git pull --rebase; git push }
