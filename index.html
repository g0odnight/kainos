<!doctype html>
<html lang="lt"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kainų palyginimas</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#1f7a4d"><link rel="icon" href="icon.svg">
<style>
:root{--bg:#f4f6f3;--card:#fff;--tx:#18201a;--mu:#6a746b;--ac:#16a05d;--ac2:#0f7a46;--bd:#e3e8e2;--ok:#e4f6ec;--warn:#fff4dd;--warnt:#8a5a00;--sh:0 1px 2px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.05);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f130f;--card:#1a201a;--tx:#e9eee8;--mu:#97a095;--ac:#3fc583;--ac2:#2fa86c;--bd:#2a312a;--ok:#16301f;--warn:#33280f;--warnt:#f0c36a;--sh:none;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f130f;--card:#1a201a;--tx:#e9eee8;--mu:#97a095;--ac:#3fc583;--ac2:#2fa86c;--bd:#2a312a;--ok:#16301f;--warn:#33280f;--warnt:#f0c36a;--sh:none;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:680px;margin:0 auto;padding:0 14px 96px}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 2px 8px}
h1{font-size:22px;margin:0;letter-spacing:-.3px}
.fresh{font-size:12.5px;border:1px solid var(--bd);background:var(--card);color:var(--mu);border-radius:99px;padding:5px 11px}
.fresh.old{background:var(--warn);color:var(--warnt);border-color:transparent}
.search{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:6px 0 8px}
.sb{display:flex;align-items:center;background:var(--card);border:1.5px solid var(--bd);border-radius:16px;box-shadow:var(--sh);padding:0 6px 0 14px}
.sb:focus-within{border-color:var(--ac)}
.sb input{flex:1;border:0;background:transparent;color:var(--tx);font:inherit;font-size:17px;padding:14px 8px;outline:0;min-width:0}
.sb button{border:0;background:transparent;color:var(--mu);font-size:20px;padding:8px 10px}
.chips{display:flex;gap:7px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--bd);background:var(--card);color:var(--mu);border-radius:99px;padding:6px 13px;font:inherit;font-size:14px;display:flex;align-items:center;gap:6px}
.chip i{width:9px;height:9px;border-radius:50%;display:block}
.chip.on{color:var(--tx);border-color:var(--tx)}
.chip:not(.on) i{opacity:.35}
.ctl{display:flex;gap:8px;margin:10px 0 4px;align-items:center;justify-content:space-between}
.seg{display:flex;background:var(--bd);border-radius:11px;padding:3px}
.seg button{border:0;background:transparent;color:var(--mu);font:inherit;font-size:13.5px;padding:6px 11px;border-radius:9px}
.seg button.on{background:var(--card);color:var(--tx);box-shadow:var(--sh)}
.sum{font-size:14px;color:var(--mu);margin:10px 2px 4px}.sum b{color:var(--tx)}
.row{display:flex;align-items:center;gap:11px;background:var(--card);border:1.5px solid transparent;border-radius:14px;padding:11px 12px;margin:8px 0;box-shadow:var(--sh)}
.row.best{border-color:var(--ac);background:var(--ok)}
.badge{flex:none;min-width:58px;text-align:center;color:#fff;font-size:12px;font-weight:700;border-radius:8px;padding:5px 6px}
.mid{flex:1;min-width:0}.nm{font-size:15px;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.meta{font-size:12.5px;color:var(--mu);margin-top:3px;display:flex;gap:6px;flex-wrap:wrap}
.tag{background:var(--warn);color:var(--warnt);border-radius:6px;padding:0 6px}
.pr{text-align:right;flex:none}.pr b{font-size:18px;display:block}.pr small{font-size:12px;color:var(--mu)}
.best .pr b{color:var(--ac2)}.bt{display:inline-block;background:var(--ac);color:#fff;border-radius:6px;font-size:11px;padding:1px 6px;margin-bottom:2px}
.cta{width:100%;border:0;background:var(--ac);color:#fff;font:inherit;font-weight:600;border-radius:14px;padding:13px;margin:10px 0}
.ghost{border:1.5px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;padding:9px 14px;font:inherit}
.empty{text-align:center;color:var(--mu);padding:34px 10px}.empty big{display:block;font-size:42px}
.more{display:block;margin:6px auto;color:var(--mu)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);z-index:9}
nav div{display:flex;width:100%;max-width:680px}
nav button{flex:1;border:0;background:transparent;color:var(--mu);font:inherit;font-size:12.5px;padding:9px 0 8px}
nav button.on{color:var(--ac2);font-weight:700}nav button span{display:block;font-size:20px;line-height:1.1}
.demo{background:var(--warn);color:var(--warnt);border-radius:12px;padding:9px 12px;font-size:13.5px;margin:6px 0}
.q{display:flex;align-items:center;gap:4px}.q button{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;width:30px;height:30px;font-size:17px}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:none;align-items:flex-end;justify-content:center}.sheet.show{display:flex}
.sheet>div{background:var(--bg);width:100%;max-width:680px;border-radius:20px 20px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px));max-height:80vh;overflow:auto}
h3{margin:14px 2px 4px;font-size:15px}
</style></head><body>
<header><h1>🛒 Kainos</h1><button class="fresh" id="fresh">…</button></header>
<div id="v1">
 <div class="search"><div class="sb"><span>🔎</span><input id="q" type="search" enterkeyhint="search" placeholder="Ko ieškai? pvz. vištienos filė" autocomplete="off"><button id="x" hidden aria-label="Išvalyti">✕</button></div>
 <div class="chips" id="chips"></div></div>
 <div class="ctl"><div class="seg" id="mode"><button data-m="all" class="on">Visi pasiūlymai</button><button data-m="store">Pagal parduotuvę</button></div>
 <div class="seg" id="sort"><button data-s="price" class="on">€</button><button data-s="unit">€/kg·l</button></div></div>
 <div id="res"></div>
</div>
<div id="v2" hidden><div id="cart"></div></div>
<nav><div><button id="n1" class="on"><span>🔎</span>Paieška</button><button id="n2"><span>🧺</span>Krepšelis <b id="cc"></b></button></div></nav>
<div class="sheet" id="sheet"><div id="sheetc"></div></div>
<script>
const COL={Maxima:"#e11d2e",Rimi:"#ea6a00",Lidl:"#0b5ed7",IKI:"#7c3aed",Norfa:"#0d9488",Promo:"#64748b"};
let DB={stores:[],rows:[],updated:null,status:{}},sel=new Set(),cart=[],mode="all",sortBy="price",demo=false,Q="",lim=40,open=new Set();
const $=s=>document.querySelector(s);
const ls=(k,v)=>{try{if(v===undefined)return JSON.parse(localStorage.getItem(k));localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}};
const norm=s=>s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/,/g,".").replace(/%/g,"");
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const eur=n=>n.toFixed(2).replace(".",",")+" €";
const col=s=>COL[s]||"#475569";
function unit(n,p){const m=norm(n).match(/(\d+(?:\.\d+)?)\s*(kg|g|ml|l)\b/);
 if(!m){return /\bkg\b/.test(norm(n))?{v:p,l:"kg"}:null}
 const q=parseFloat(m[1]);if(!q)return null;const t=m[2];
 return t=="g"?{v:p/q*1000,l:"kg"}:t=="ml"?{v:p/q*1000,l:"l"}:{v:p/q,l:t}}
function demoData(){const S=["Maxima","Rimi","Lidl","IKI","Norfa","Promo"],k=[1,1.06,.93,1.08,.98,.9];
 const B=[["Pienas ŽEMAITIJOS 1,5% 1 l",1.09],["Pienas ROKIŠKIO 2,5% 1 l",1.19],["Pienas 3,5% 2 l",2.19],["Vištienos filė šaldyta 1 kg",7.5],["Vištienos krūtinėlės filė atvėsinta 1 kg",8.9],["Kiaušiniai M 10 vnt.",2.9],["Duona juoda 600 g",1.4],["Sviestas 82% 200 g",2.7],["Bananai 1 kg",1.5],["Spagečiai 500 g",1.8],["Cukrus 1 kg",1.3],["Jogurtas natūralus 400 g",.95],["Kava malta 250 g",3.4],["Kiaulienos kumpis 1 kg",6.2],["Lašišos filė 1 kg",15.5]];
 const items=[];B.forEach(([n,p],i)=>S.forEach((s,j)=>{const lf=(i*7+j*3)%9==0;items.push([j,n,+(p*k[j]*(lf?.85:1)).toFixed(2),lf?"l":"e",lf?"2026-11-27":""])}));
 return{stores:S,items,updated:new Date().toISOString(),status:{}}}
function init(j,d){demo=!!d;DB=j;
 DB.rows=j.items.map(a=>({s:j.stores[a[0]],name:a[1],price:a[2],kind:a[3]||"e",until:a[4]||"",n:norm(a[1]),u:unit(a[1],a[2])}));
 const saved=ls("sel"),have=new Set(DB.rows.map(r=>r.s));
 sel=new Set((saved&&saved.length?saved:j.stores).filter(s=>have.has(s)));if(!sel.size)sel=new Set(have);
 chips();draw();fresh()}
async function load(){try{const r=await fetch("prices.json",{cache:"no-cache"});const j=await r.json();if(!j.items||!j.items.length)throw 0;init(j,false)}catch(e){init(demoData(),true)}}
function fresh(){const b=$("#fresh");if(!DB.updated){b.textContent="Nėra duomenų";return}
 const d=new Date(DB.updated),h=(Date.now()-d)/36e5,t=d.toLocaleTimeString("lt-LT",{hour:"2-digit",minute:"2-digit"});
 const same=d.toDateString()==new Date().toDateString();
 b.textContent=demo?"Demo duomenys":(same?"Šiandien "+t:"Atnaujinta "+d.toLocaleDateString("lt-LT",{month:"2-digit",day:"2-digit"})+" "+t);
 b.classList.toggle("old",demo||h>36)}
function chips(){const have=[...new Set(DB.rows.map(r=>r.s))];
 $("#chips").innerHTML=have.map(s=>`<button class="chip ${sel.has(s)?"on":""}" data-s="${s}"><i style="background:${col(s)}"></i>${s}</button>`).join("")}
$("#chips").onclick=e=>{const b=e.target.closest("[data-s]");if(!b)return;const s=b.dataset.s;sel.has(s)?sel.delete(s):sel.add(s);ls("sel",[...sel]);chips();draw()};
function find(q,stores){const t=norm(q).split(/\s+/).filter(Boolean);if(!t.length)return[];
 return DB.rows.filter(r=>stores.has(r.s)&&t.every(x=>r.n.includes(x)))}
const key=r=>sortBy=="unit"?(r.u?r.u.v:1e9):r.price;
const cmp=(a,b)=>key(a)-key(b)||a.price-b.price;
function row(r,best,base){
 const d=!best&&base!=null&&sortBy=="price"?`<small>+${eur(r.price-base)}</small>`:"";
 const u=r.u?`<span>${eur(r.u.v)}/${r.u.l}</span>`:"";
 const lf=r.kind=="l"?`<span class="tag">leidinys${r.until?" iki "+r.until.slice(5).replace("-","."):""}</span>`:"";
 return `<div class="row ${best?"best":""}"><span class="badge" style="background:${col(r.s)}">${r.s}</span><div class="mid"><div class="nm">${esc(r.name)}</div><div class="meta">${u}${lf}</div></div><div class="pr">${best?'<span class="bt">Pigiausia</span>':""}<b>${eur(r.price)}</b>${d}</div></div>`}
function drawSearch(){
 const q=Q.trim(),el=$("#res");$("#x").hidden=!q;
 if(!q){el.innerHTML=`<div class="empty"><big>🛍️</big>Įvesk prekę ir pamatysi visų parduotuvių kainas, pigiausios viršuje.</div>`;return}
 const r=find(q,sel).sort(cmp);
 if(!r.length){el.innerHTML=`<div class="empty"><big>🤷</big>Nieko nerasta „${esc(q)}“.<br>Pabandyk trumpesnį žodį ar įjunk daugiau parduotuvių.</div>`;return}
 const b=r[0],base=key(b)==b.price?b.price:null;
 let h=`<div class="sum">Rasta <b>${r.length}</b> · pigiausia <b>${b.s} ${eur(b.price)}</b></div><button class="cta" id="addc">+ Į krepšelį: ${esc(q)}</button>`;
 if(mode=="all"){h+=r.slice(0,lim).map((x,i)=>row(x,i==0,b.price)).join("");if(r.length>lim)h+=`<button class="ghost more" id="more">Rodyti daugiau (${r.length-lim})</button>`}
 else{const g={};r.forEach(x=>(g[x.s]=g[x.s]||[]).push(x));
  Object.values(g).sort((a,b)=>cmp(a[0],b[0])).forEach((l,i)=>{h+=row(l[0],i==0,b.price);
   if(l.length>1){h+=`<button class="ghost more" data-o="${l[0].s}">${open.has(l[0].s)?"Slėpti":"Dar "+(l.length-1)+" "+l[0].s+" pasiūlymai"}</button>`;if(open.has(l[0].s))h+=l.slice(1,30).map(x=>row(x,false,b.price)).join("")}})}
 el.innerHTML=h;
 const m=$("#more");if(m)m.onclick=()=>{lim+=60;draw()};
 $("#addc").onclick=()=>{const f=cart.find(c=>c.q.toLowerCase()==q.toLowerCase());f?f.n++:cart.push({q,n:1});ls("cart",cart);draw();const a=$("#addc");if(a){a.textContent="✓ Pridėta";}}}
$("#res").addEventListener("click",e=>{const o=e.target.dataset.o;if(o){open.has(o)?open.delete(o):open.add(o);draw()}});
function drawCart(){
 $("#cc").textContent=cart.length?"("+cart.length+")":"";
 const el=$("#cart");if(!cart.length){el.innerHTML=`<div class="empty"><big>🧺</big>Krepšelis tuščias. Surask prekę ir spausk „Į krepšelį“.</div>`;return}
 let h="<h3>Prekės</h3>";
 cart.forEach((c,i)=>{const b=find(c.q,sel).sort(cmp)[0];
  h+=`<div class="row"><div class="mid"><div class="nm"><b>${esc(c.q)}</b></div><div class="meta">${b?`<span class="badge" style="background:${col(b.s)};padding:1px 7px">${b.s}</span><span>${esc(b.name)}</span>`:"nerasta"}</div></div><div class="pr q"><button data-m="${i}">−</button><b style="display:inline;font-size:16px;margin:0 4px">${c.n}</b><button data-p="${i}">+</button></div></div>`});
 const tot=[...sel].map(s=>{let t=0,miss=0;cart.forEach(c=>{const b=find(c.q,new Set([s])).sort(cmp)[0];b?t+=b.price*c.n:miss++});return{s,t,miss}}).sort((a,b)=>a.miss-b.miss||a.t-b.t);
 const best=tot.find(x=>!x.miss);let mix=0;cart.forEach(c=>{const b=find(c.q,sel).sort(cmp)[0];if(b)mix+=b.price*c.n});
 h+="<h3>Kiek kainuotų viename krepšelyje</h3>"+tot.map(x=>`<div class="row ${best&&x.s==best.s?"best":""}"><span class="badge" style="background:${col(x.s)}">${x.s}</span><div class="mid meta">${x.miss?"trūksta "+x.miss+" prekių":(best&&x.s==best.s?"Pigiausia parduotuvė":"")}</div><div class="pr"><b>${x.miss?"—":eur(x.t)}</b></div></div>`).join("");
 h+=`<div class="row"><div class="mid">Kiekviena prekė iš pigiausios parduotuvės</div><div class="pr"><b>${eur(mix)}</b></div></div><button class="ghost" id="clr">Išvalyti krepšelį</button>`;
 el.innerHTML=h;$("#clr").onclick=()=>{cart=[];ls("cart",cart);draw()}}
$("#cart").onclick=e=>{const m=e.target.dataset.m,p=e.target.dataset.p;if(m!=null){cart[m].n--;if(cart[m].n<1)cart.splice(m,1)}else if(p!=null)cart[p].n++;else return;ls("cart",cart);draw()};
function draw(){drawSearch();drawCart();$("#cc").textContent=cart.length?"("+cart.length+")":""}
function tab(n){$("#v1").hidden=n!=1;$("#v2").hidden=n!=2;$("#n1").classList.toggle("on",n==1);$("#n2").classList.toggle("on",n==2);scrollTo(0,0);draw()}
$("#n1").onclick=()=>tab(1);$("#n2").onclick=()=>tab(2);
let tm;$("#q").oninput=e=>{clearTimeout(tm);tm=setTimeout(()=>{Q=e.target.value;lim=40;drawSearch()},120)};
$("#x").onclick=()=>{$("#q").value="";Q="";drawSearch();$("#q").focus()};
$("#mode").onclick=e=>{const m=e.target.dataset.m;if(!m)return;mode=m;[...$("#mode").children].forEach(b=>b.classList.toggle("on",b.dataset.m==m));drawSearch()};
$("#sort").onclick=e=>{const s=e.target.dataset.s;if(!s)return;sortBy=s;[...$("#sort").children].forEach(b=>b.classList.toggle("on",b.dataset.s==s));draw()};
$("#fresh").onclick=()=>{const st=DB.status||{};const per=DB.stores.map(s=>{const r=DB.rows.filter(x=>x.s==s),e=r.filter(x=>x.kind=="e").length,l=r.filter(x=>x.kind=="l").length;const w=Object.values(st[s]||{}).filter(v=>typeof v=="string").join("; ");
  return `<div class="row"><span class="badge" style="background:${col(s)}">${s}</span><div class="mid meta">${r.length?`e-parduotuvė: ${e} · leidiniai: ${l}`:"nėra duomenų"}${w?`<span class="tag">${esc(w)}</span>`:""}</div></div>`}).join("");
 $("#sheetc").innerHTML=`<h3 style="margin-top:0">Duomenų šaltiniai</h3><div class="sum">${DB.updated?"Atnaujinta "+new Date(DB.updated).toLocaleString("lt-LT")+". Kainos atnaujinamos kasdien ~08:00.":""}</div>${per}<button class="cta" id="cl">Uždaryti</button>`;
 $("#sheet").classList.add("show");$("#cl").onclick=()=>$("#sheet").classList.remove("show")};
$("#sheet").onclick=e=>{if(e.target.id=="sheet")$("#sheet").classList.remove("show")};
cart=Array.isArray(ls("cart"))?ls("cart"):[];
load();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
